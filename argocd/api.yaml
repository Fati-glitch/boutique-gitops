apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # supprimer l'Application supprime aussi ses ressources
spec:
  project: default
  source:
    repoURL: https://github.com/Fati-glitch/boutique-gitops.git
    targetRevision: main          # la branche surveillée
    path: api                   # le dossier à déployer
  destination:
    server: https://kubernetes.default.svc   # le cluster où tourne Argo CD
    namespace: boutique
  syncPolicy:
    automated:
      prune: true                 # supprime du cluster ce qui a disparu de Git
      selfHeal: true              # annule les modifications faites à la main
    syncOptions:
      - CreateNamespace=true      # crée le namespace s'il n'existe pas