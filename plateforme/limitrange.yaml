apiVersion: v1
kind: LimitRange
metadata:
  name: valeurs-par-defaut
spec:
  limits:
    - type: Container
      defaultRequest:          # requests appliquées si le conteneur n'en déclare pas
        cpu: 50m
        memory: 64Mi
      default:                 # limits appliquées si le conteneur n'en déclare pas
        cpu: 200m
        memory: 128Mi